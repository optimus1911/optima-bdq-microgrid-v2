services:
  optima-gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST to the TLS hostname}
      HOME: /tmp/home
      XDG_CACHE_HOME: /tmp/cache
      MPLCONFIGDIR: /tmp/matplotlib
      STREAMLIT_SERVER_ADDRESS: 127.0.0.1
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ENABLE_CORS: "true"
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_CLIENT_SHOW_ERROR_DETAILS: "none"
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8443}:8443"
    secrets:
      - source: basic_auth
        target: htpasswd
      - source: tls_certificate
        target: tls.crt
      - source: tls_private_key
        target: tls.key
    networks:
      - gateway_private
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

secrets:
  basic_auth:
    file: ${BASIC_AUTH_FILE:?Set BASIC_AUTH_FILE to an external htpasswd file}
  tls_certificate:
    file: ${TLS_CERT_FILE:?Set TLS_CERT_FILE to the TLS certificate chain}
  tls_private_key:
    file: ${TLS_KEY_FILE:?Set TLS_KEY_FILE to the TLS private key}

networks:
  gateway_private:
    internal: true
